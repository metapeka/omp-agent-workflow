<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Architecture: OMP extension, workflow core, external supervisor, and worktree backends">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b98b8"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7ee787"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" rx="14" fill="#0f152a" stroke="#26304d"/>
  <text x="28" y="38" fill="#d6deff" font-family="sans-serif" font-size="20" font-weight="700">omp-agent-workflow — architecture</text>
  <text x="28" y="60" fill="#8b98b8" font-family="sans-serif" font-size="13">A workflow layer around OMP: deterministic budgets, session handoff, orchestration.</text>

  <rect x="28" y="86" width="270" height="168" rx="10" fill="#151c34" stroke="#79c0ff"/>
  <text x="44" y="112" fill="#79c0ff" font-family="sans-serif" font-size="14" font-weight="700">OMP extension</text>
  <text x="44" y="136" fill="#d6deff" font-family="monospace" font-size="12">index.ts</text>
  <text x="44" y="154" fill="#8b98b8" font-family="sans-serif" font-size="12">context guard · /handoff · /handoff-new</text>
  <text x="44" y="172" fill="#8b98b8" font-family="sans-serif" font-size="12">/handoff-preflight · status key</text>
  <text x="44" y="198" fill="#d6deff" font-family="monospace" font-size="12">orchestrator.ts</text>
  <text x="44" y="216" fill="#8b98b8" font-family="sans-serif" font-size="12">/orchestrate · /wrap · tools</text>
  <text x="44" y="240" fill="#febc2e" font-family="sans-serif" font-size="12">Settings → Plugins (13 keys) + env fallback</text>

  <rect x="345" y="86" width="270" height="168" rx="10" fill="#151c34" stroke="#7ee787"/>
  <text x="361" y="112" fill="#7ee787" font-family="sans-serif" font-size="14" font-weight="700">Workflow state</text>
  <text x="361" y="136" fill="#d6deff" font-family="monospace" font-size="12">HANDOFF.md</text>
  <text x="361" y="154" fill="#8b98b8" font-family="sans-serif" font-size="12">human-readable continue point</text>
  <text x="361" y="178" fill="#d6deff" font-family="monospace" font-size="12">AUTOPLAN.md + STATE.json</text>
  <text x="361" y="196" fill="#8b98b8" font-family="sans-serif" font-size="12">tasks · attempts · budgets · stop</text>
  <text x="361" y="220" fill="#d6deff" font-family="monospace" font-size="12">.omp-handoff-request.json</text>
  <text x="361" y="238" fill="#8b98b8" font-family="sans-serif" font-size="12">marker = “ready for a new session”</text>

  <rect x="662" y="86" width="270" height="168" rx="10" fill="#151c34" stroke="#ffa657"/>
  <text x="678" y="112" fill="#ffa657" font-family="sans-serif" font-size="14" font-weight="700">External supervisor</text>
  <text x="678" y="136" fill="#d6deff" font-family="monospace" font-size="12">bin/omp-handoff-supervisor.mjs</text>
  <text x="678" y="156" fill="#8b98b8" font-family="sans-serif" font-size="12">not an LLM: marker + terminal handle</text>
  <text x="678" y="176" fill="#8b98b8" font-family="sans-serif" font-size="12">survives the OMP session</text>
  <text x="678" y="200" fill="#d6deff" font-family="monospace" font-size="11">lock per dir · retries · cooldown</text>
  <text x="678" y="222" fill="#8b98b8" font-family="sans-serif" font-size="12">sends /handoff-new + continue prompt</text>

  <rect x="28" y="300" width="446" height="150" rx="10" fill="#151c34" stroke="#8b98b8"/>
  <text x="44" y="326" fill="#d6deff" font-family="sans-serif" font-size="14" font-weight="700">Orchestration loop</text>
  <text x="44" y="350" fill="#8b98b8" font-family="sans-serif" font-size="12">AUTOPLAN → worktree → implement → verify → ff-merge</text>
  <text x="44" y="370" fill="#8b98b8" font-family="sans-serif" font-size="12">gate / attempts / cost / time stops · one current task</text>
  <text x="44" y="394" fill="#8b98b8" font-family="sans-serif" font-size="12">cleanup guard: merged + clean + not current</text>
  <text x="44" y="412" fill="#8b98b8" font-family="sans-serif" font-size="12">+ no live process/terminal · backup ref keeps the tip</text>
  <text x="44" y="436" fill="#febc2e" font-family="sans-serif" font-size="12">branch is retained by default; delete only with git branch -d</text>

  <rect x="510" y="300" width="422" height="150" rx="10" fill="#151c34" stroke="#79c0ff"/>
  <text x="526" y="326" fill="#79c0ff" font-family="sans-serif" font-size="14" font-weight="700">Backends</text>
  <text x="526" y="350" fill="#d6deff" font-family="monospace" font-size="12">orca worktree create / rm</text>
  <text x="526" y="368" fill="#8b98b8" font-family="sans-serif" font-size="12">default; keeps Orca metadata in sync</text>
  <text x="526" y="392" fill="#d6deff" font-family="monospace" font-size="12">git worktree add / remove</text>
  <text x="526" y="410" fill="#8b98b8" font-family="sans-serif" font-size="12">fallback and tests</text>
  <text x="526" y="434" fill="#ff7b72" font-family="sans-serif" font-size="12">Orca stops the target PTYs — never clean up from inside it</text>

  <line x1="298" y1="150" x2="345" y2="150" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="615" y1="150" x2="662" y2="150" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M662 230 C662 262 630 262 630 300" fill="none" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M298 386 C330 386 330 254 345 200" fill="none" stroke="#7ee787" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="306" y="276" fill="#7ee787" font-family="sans-serif" font-size="11">updates</text>
</svg>
