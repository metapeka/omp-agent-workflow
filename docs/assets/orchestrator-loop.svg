<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Orchestrator loop: plan, worktree, verify, merge, cleanup, handoff">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b98b8"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ff7b72"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="14" fill="#0f152a" stroke="#26304d"/>
  <text x="28" y="38" fill="#d6deff" font-family="sans-serif" font-size="20" font-weight="700">The orchestrator loop</text>
  <text x="28" y="60" fill="#8b98b8" font-family="sans-serif" font-size="13">One current task. Deterministic gates. Merge is always fast-forward.</text>

  <g font-family="sans-serif" font-size="12">
    <rect x="30" y="100" width="150" height="74" rx="9" fill="#151c34" stroke="#79c0ff"/>
    <text x="105" y="128" fill="#79c0ff" font-weight="700" text-anchor="middle">AUTOPLAN.md</text>
    <text x="105" y="150" fill="#8b98b8" text-anchor="middle">tasks + deps + verify</text>

    <rect x="222" y="100" width="150" height="74" rx="9" fill="#151c34" stroke="#8b98b8"/>
    <text x="297" y="128" fill="#d6deff" font-weight="700" text-anchor="middle">start</text>
    <text x="297" y="150" fill="#8b98b8" text-anchor="middle">create worktree</text>

    <rect x="414" y="100" width="150" height="74" rx="9" fill="#151c34" stroke="#8b98b8"/>
    <text x="489" y="128" fill="#d6deff" font-weight="700" text-anchor="middle">implement</text>
    <text x="489" y="150" fill="#8b98b8" text-anchor="middle">agent writes code</text>

    <rect x="606" y="100" width="150" height="74" rx="9" fill="#151c34" stroke="#febc2e"/>
    <text x="681" y="128" fill="#febc2e" font-weight="700" text-anchor="middle">verify</text>
    <text x="681" y="150" fill="#8b98b8" text-anchor="middle">checks in worktree</text>

    <rect x="798" y="100" width="132" height="74" rx="9" fill="#151c34" stroke="#7ee787"/>
    <text x="864" y="128" fill="#7ee787" font-weight="700" text-anchor="middle">finish</text>
    <text x="864" y="150" fill="#8b98b8" text-anchor="middle">ff-merge</text>
  </g>

  <line x1="180" y1="137" x2="222" y2="137" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="372" y1="137" x2="414" y2="137" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="564" y1="137" x2="606" y2="137" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="756" y1="137" x2="798" y2="137" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>

  <g font-family="sans-serif" font-size="12">
    <rect x="686" y="222" width="244" height="92" rx="9" fill="#151c34" stroke="#7ee787"/>
    <text x="702" y="246" fill="#7ee787" font-weight="700">cleanup guard</text>
    <text x="702" y="268" fill="#8b98b8">merged · clean · not current/base</text>
    <text x="702" y="286" fill="#8b98b8">no live process or Orca terminal</text>
    <text x="702" y="304" fill="#febc2e">tip → refs/omp-worktree-backup/*</text>

    <rect x="414" y="250" width="210" height="96" rx="9" fill="#151c34" stroke="#79c0ff"/>
    <text x="430" y="274" fill="#79c0ff" font-weight="700">next decision</text>
    <text x="430" y="296" fill="#8b98b8">continue · stop · handoff</text>
    <text x="430" y="314" fill="#8b98b8">budgets, gates, context %</text>
    <text x="430" y="334" fill="#8b98b8">STATE.json is the source</text>

    <rect x="30" y="250" width="330" height="96" rx="9" fill="#151c34" stroke="#ff7b72"/>
    <text x="46" y="274" fill="#ff7b72" font-weight="700">stops (deterministic)</text>
    <text x="46" y="296" fill="#8b98b8">plan-changed · base-dirty · merge-conflict</text>
    <text x="46" y="314" fill="#8b98b8">cost-unavailable · attempts-exceeded</text>
    <text x="46" y="332" fill="#8b98b8">gate · budget-tasks / time / spend</text>
  </g>

  <path d="M864 174 L864 222" fill="none" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="686" y1="268" x2="624" y2="290" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M414 298 C340 298 250 298 200 232" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>

  <path d="M497 346 C497 400 200 400 105 174" fill="none" stroke="#7ee787" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="250" y="416" fill="#7ee787" font-family="sans-serif" font-size="12">next task → new worktree; at a boundary → handoff</text>

  <text x="28" y="450" fill="#8b98b8" font-family="sans-serif" font-size="11">Human-in-the-loop: /wrap shows the same facts and asks for confirmation before any destructive action.</text>
</svg>
