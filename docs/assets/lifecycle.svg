<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Context lifecycle and handoff flow">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b98b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" rx="14" fill="#0f152a" stroke="#26304d"/>
  <text x="28" y="38" fill="#d6deff" font-family="sans-serif" font-size="20" font-weight="700">Context lifecycle: guard → handoff → fresh session</text>
  <text x="28" y="60" fill="#8b98b8" font-family="sans-serif" font-size="13">The plugin never guesses: thresholds are settings, the transition is a file protocol.</text>

  <rect x="30" y="94" width="840" height="16" rx="8" fill="#1c2742"/>
  <rect x="30" y="94" width="336" height="16" rx="8" fill="#7ee787"/>
  <rect x="366" y="94" width="168" height="16" fill="#febc2e"/>
  <rect x="534" y="94" width="336" height="16" rx="8" fill="#ff7b72"/>
  <text x="30" y="86" fill="#7ee787" font-family="sans-serif" font-size="12" font-weight="700">work</text>
  <text x="366" y="86" fill="#febc2e" font-family="sans-serif" font-size="12" font-weight="700">watch</text>
  <text x="534" y="86" fill="#ff7b72" font-family="sans-serif" font-size="12" font-weight="700">handoff / compact</text>
  <text x="30" y="136" fill="#8b98b8" font-family="monospace" font-size="11">0%</text>
  <text x="338" y="136" fill="#8b98b8" font-family="monospace" font-size="11">35%</text>
  <text x="516" y="136" fill="#8b98b8" font-family="monospace" font-size="11">50%</text>
  <text x="842" y="136" fill="#8b98b8" font-family="monospace" font-size="11">100%</text>
  <text x="150" y="126" fill="#0b1020" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">no interruption</text>
  <text x="450" y="126" fill="#0b1020" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">no giant reads</text>
  <text x="702" y="126" fill="#0b1020" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">HANDOFF marker · compact</text>

  <g font-family="sans-serif" font-size="12">
    <rect x="30" y="176" width="180" height="92" rx="9" fill="#151c34" stroke="#8b98b8"/>
    <text x="46" y="200" fill="#d6deff" font-weight="700">1. update state</text>
    <text x="46" y="222" fill="#8b98b8">HANDOFF.md: goal,</text>
    <text x="46" y="240" fill="#8b98b8">decisions, checks, next</text>

    <rect x="248" y="176" width="180" height="92" rx="9" fill="#151c34" stroke="#8b98b8"/>
    <text x="264" y="200" fill="#d6deff" font-weight="700">2. write marker</text>
    <text x="264" y="222" fill="#8b98b8" font-family="monospace" font-size="10">.omp-handoff-request.json</text>
    <text x="264" y="240" fill="#8b98b8">only at a safe boundary</text>

    <rect x="466" y="176" width="180" height="92" rx="9" fill="#151c34" stroke="#ffa657"/>
    <text x="482" y="200" fill="#ffa657" font-weight="700">3. supervisor</text>
    <text x="482" y="222" fill="#8b98b8">sends /handoff-new to</text>
    <text x="482" y="240" fill="#8b98b8">the terminal handle</text>

    <rect x="684" y="176" width="186" height="92" rx="9" fill="#151c34" stroke="#7ee787"/>
    <text x="700" y="200" fill="#7ee787" font-weight="700">4. fresh session</text>
    <text x="700" y="222" fill="#8b98b8">state file embedded in</text>
    <text x="700" y="240" fill="#8b98b8">the custom message</text>
  </g>

  <line x1="210" y1="222" x2="248" y2="222" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="428" y1="222" x2="466" y2="222" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="646" y1="222" x2="684" y2="222" stroke="#8b98b8" stroke-width="1.6" marker-end="url(#a)"/>

  <g font-family="sans-serif" font-size="12">
    <rect x="30" y="300" width="420" height="104" rx="9" fill="#151c34" stroke="#79c0ff"/>
    <text x="46" y="324" fill="#79c0ff" font-weight="700">Modes (OMP_WORKFLOW_MODE)</text>
    <text x="46" y="348" fill="#d6deff" font-family="monospace" font-size="11">manual — no auto-compact, no handoff</text>
    <text x="46" y="366" fill="#d6deff" font-family="monospace" font-size="11">assisted — auto-compact at 60% (default)</text>
    <text x="46" y="384" fill="#d6deff" font-family="monospace" font-size="11">yoda — 70% fallback + handoff at 55%</text>
    <text x="46" y="400" fill="#d6deff" font-family="monospace" font-size="11">yoda-supervised — 55% + supervisor</text>
  </g>
  <text x="500" y="316" fill="#ff7b72" font-family="sans-serif" font-size="12" font-weight="700">Safety rule</text>
  <text x="500" y="338" fill="#8b98b8" font-family="sans-serif" font-size="12">no compact inside a tool loop or unfinished edit;</text>
  <text x="500" y="356" fill="#8b98b8" font-family="sans-serif" font-size="12">wait for turn_end and ctx.isIdle().</text>
  <text x="500" y="382" fill="#8b98b8" font-family="sans-serif" font-size="12">Settings &gt; env &gt; mode default.</text>
</svg>
